<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS</title>
    <style>
      nav {
        width: 100%;
        height: 40px;
        position: fixed;
        display: flex;
        justify-content: space-between;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      img {
        width: 40px;
        height: 40px;
      }
      p {
        padding-left: 20px;
        font-size: 21px;
        font-weight: 600;
      }
      button {
        border: 0;
        background-color: rgb(255, 255, 255);
        height: 40px;
        padding: 8px 16px;
      }
      div {
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      a {
        color: black;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <nav>
      <div>
        <img src="./img/siamese-cat-48032_1280.png" />
        <p>SMUMC</p>
      </div>
      <div>
        <button><a href="/">PROJECTS</a></button>
        <button><a href="/">MEMBERS</a></button>
        <button><a href="/">NOTICE</a></button>
        <button>
          <svg width="40px" height="40px">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </nav>
  </body>
</html>
