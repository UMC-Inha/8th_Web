<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f5f5;
      }

      h1 {
        margin-bottom: 20px;
      }

      .input-container {
        margin-bottom: 20px;
      }

      input {
        width: 60%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
      }

      .study-container {
        display: flex;
        justify-content: center;
        gap: 50px;
      }

      .todo,
      .done {
        width: 30%;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2);
        align-items: center;
      }

      .complete-btn,
      .delete-btn {
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.2);
      }

      .complete-btn {
        background-color: #4caf50;
        color: white;
      }

      .delete-btn {
        background-color: #ff5555;
        color: white;
      }
    </style>
    <script defer>
      document.addEventListener("DOMContentLoaded", function () {
        const studyInput = document.getElementById("study-input");
        const todoList = document.getElementById("todo-list");
        const doneList = document.getElementById("done-list");

        // Enter 키 입력 시 추가 이벤트
        studyInput.addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            addTask(studyInput.value);
            studyInput.value = "";
          }
        });

        function addTask(task) {
          if (task.trim() === "") return;

          const li = document.createElement("li");
          li.innerHTML = `
              ${task}
              <button class="complete-btn">완료</button>
          `;

          // 완료 버튼 클릭 시 '해낸 일' 목록으로 이동
          li.querySelector(".complete-btn").addEventListener(
            "click",
            function () {
              moveToDone(li, task);
            }
          );

          todoList.appendChild(li);
        }

        function moveToDone(taskElement, task) {
          taskElement.remove();

          const li = document.createElement("li");
          li.innerHTML = `
              ${task}
              <button class="delete-btn">삭제</button>
          `;

          // 삭제 버튼 클릭 시 목록에서 제거
          li.querySelector(".delete-btn").addEventListener(
            "click",
            function () {
              li.remove();
            }
          );

          doneList.appendChild(li);
        }
      });
    </script>
  </head>
  <body>
    <h1>UMC Study Plan</h1>
    <div class="input-container">
      <input
        type="text"
        id="study-input"
        placeholder="스터디 계획을 작성해보세요!"
      />
    </div>
    <div class="study-container">
      <div class="todo">
        <h2>해야 할 일</h2>
        <ul id="todo-list"></ul>
      </div>
      <div class="done">
        <h2>해낸 일</h2>
        <ul id="done-list"></ul>
      </div>
    </div>
  </body>
</html>
