<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Pretendard;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #1f1f1f;
        color: #ffffff;
      }
      .logo {
        display: flex;
        align-items: center;
        font-size: 24px;
        font-weight: bold;
      }
      .logo img {
        width: 40px;
        height: auto;
        margin-right: 10px;
      }
      .navElements {
        display: flex;
        gap: 20px;
      }
      .navElements a {
        color: white;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <img src="main-logo.webp" alt="Logo" />
        SMUMC
      </div>
      <div class="navElements">
        <a>PROJECTS</a>
        <a>MEMBERS</a>
        <a>NOTICE</a>
        <a>🌙</a>
      </div>
    </nav>
  </body>
</html>
