<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Position: Sticky</title>
  <style>
    .container{
      width: 100vw; 
      height: 100vh;
    }
    .item {
    width: 100px; 
    height: 100%;
    position: absolute;
    top: 50%;
    left: 50%;
    right: 50%;
    transform: translate(-50%, -50%);
    background-color: aquamarine;
    }

  </style>
</head>

<body>
  <div class="container">
        <div class="item">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit maiores harum tempora magni architecto, blanditiis ducimus consequuntur temporibus at quam, natus optio cupiditate voluptate, vitae est dolores ullam perspiciatis nesciunt.
        </div>    
  </div>
</body>

</html>
