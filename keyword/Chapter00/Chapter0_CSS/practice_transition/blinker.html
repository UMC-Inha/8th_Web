<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS</title>
  <style>
    .container{
      width: 100vw;
      height: 100vh;      
    }
    .item {
      margin: 0;
      padding: 0;
      width: 60px; 
      height: 80px;
      background-color: whitesmoke;
      transform: translate(500px,100px) rotate(45deg);
      transition-property: background-color;
      transition-duration: 1s;
      transition-timing-function: linear;
    }
    .item:hover{
      background-color: rgb(255, 0, 0);
    }
    .item2 {
      margin: 0;
      padding: 0;
      width: 60px; 
      height: 80px;
      background-color: whitesmoke;
      transform: translate(500px,125px) rotate(-45deg);
      transition-duration: 1.2s;
      transition-timing-function: steps(4, end);

    }
    .item2:hover{
      background-color: rgb(255, 213, 0);
    }
    .item3 {
      margin: 0;
      padding: 0;
      width: 60px; 
      height: 80px;
      background-color: whitesmoke;
      transform: translate(500px,150px) rotate(45deg);
      transition-duration: 3.0s;
      transition-timing-function: cubic-bezier(0.42, 0, 1.0, 1.0);
    }
    .item3:hover{
      background-color: rgb(51, 255, 0);
    }

  </style>
</head>

<body>
  <div class="container">
        <div class="item">
        </div>    
        <div class="item2">
        </div>  
        <div class="item3">
        </div>  
  </div>
</body>

</html>
