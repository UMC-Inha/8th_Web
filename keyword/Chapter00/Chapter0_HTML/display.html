<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML</title>
  <style>
    .container {
      width: 90%;
      margin: 20px auto;
      padding: 20px;
      border: 2px solid gray;
      text-align: center;
    }
    .block {
      display: block;
      width: 150px;
      height: 50px;
      /* font-size: 60px; */
      background-color: lightblue;
      margin: 10px auto;
      text-align: center;
      line-height: 50px;
      border: 2px solid blue;
    }
    .inline {
      display: inline;
      /* width: 150px;
      height: 50px; */
      font-size: 40px;
      background-color: lightcoral;
      border: 2px solid red;
      padding: 5px;
      margin: 5px;
    }
    .inline-block {
      display: inline-block;
      width: 150px;
      height: 50px;
      font-size: 10px;
      background-color: lightgreen;
      margin: 10px;
      text-align: center;
      line-height: 50px;
      border: 2px solid green;
    }
  </style>
</head>

<body>
    <div class="container">
        <h2>1. Block 요소</h2>
        <div class="block">Block 1</div>
        <div class="block">Block 2</div>
        <div class="block">Block 3</div>
        <div class="block">Block 4</div>
        <div class="block">Block 5</div>

    
        <h2>2. Inline 요소</h2>
        <span class="inline">Inline 1</span>
        <span class="inline">Inline 2</span>
        <span class="inline">Inline 3</span>
        <span class="inline">Inline 4</span>
        <span class="inline">Inline 5</span>
        <span class="inline">Inline 6</span>
        <span class="inline">Inline 7</span>
        <span class="inline">Inline 8</span>
        <span class="inline">Inline 9</span>
        <span class="inline">Inline 10</span>
        <span class="inline">Inline 11</span>

    
        <h2>3. Inline-Block 요소</h2>
        <div class="inline-block">Inline-Block 1</div>
        <div class="inline-block">Inline-Block 2</div>
        <div class="inline-block">Inline-Block 3</div>
        <div class="inline-block">Inline-Block 4</div>
        <div class="inline-block">Inline-Block 5</div>


  </div>
</body>

</html>
