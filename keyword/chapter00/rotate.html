<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotate</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 40px;
        text-align: center;
      }

      .box {
        width: 100px;
        height: 100px;
        background-color: #ae9fff;
        transform: rotate(45deg);
      }
      .box2 {
        width: 100px;
        height: 100px;
        background-color: #4c2dff;
      }
    </style>
  </head>
  <body>
    <div class="box">회전</div>
    <div class="box2">기본</div>
  </body>
</html>
