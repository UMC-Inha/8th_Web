<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skew</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: yellow;
        transform: skew(20deg, 10deg);
      }
    </style>
  </head>
  <body>
    <div class="box">기울어짐</div>
  </body>
</html>
