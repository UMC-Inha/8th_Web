<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translate</title>
    <style>
      .container {
        position: relative;
        height: 100vh;
      }
      .box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 100px;
        background-color: #c2bdff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Translate</div>
    </div>
  </body>
</html>
