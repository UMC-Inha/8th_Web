<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin</title>
    <style>
      .container {
        height: 100vh; /*상하*/
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        width: 200px;
        height: 100px;
        background-color: lightgreen;
        margin: auto; /*좌우*/
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Margin</div>
    </div>
  </body>
</html>
