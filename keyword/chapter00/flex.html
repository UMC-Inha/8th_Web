<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 10px;
      }
      .box {
        width: 200px;
        height: 100px;
        background-color: lightcoral;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Flexbox1</div>
      <div class="box">Flexbox2</div>
      <div class="box">Flexbox3</div>
    </div>
  </body>
</html>
