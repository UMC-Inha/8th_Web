<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr;
        place-items: center;
        height: 100vh;
      }
      .box {
        width: 200px;
        height: 100px;
        background-color: #4d92d3;
        text-align: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">grid1</div>
      <div class="box">grid2</div>
      <div class="box">grid3</div>
    </div>
  </body>
</html>
