<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scale</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: #f9b5b5;
        text-align: center;
      }
      .box2 {
        width: 100px;
        height: 100px;
        background-color: #71ef81;
        transform: scale(1.5);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="box">기본</div>
    <div class="box2">1.5배</div>
  </body>
</html>
