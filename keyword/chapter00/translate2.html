<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translate</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: #ff4343;
        transform: translate(50px, 100px);
      }
      .box2 {
        width: 100px;
        height: 100px;
        background-color: #2bf4ff;
        transform: translate(300px, 200px);
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box2"></div>
  </body>
</html>
