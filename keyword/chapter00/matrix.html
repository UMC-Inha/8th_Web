<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 100px;
        text-align: center;
      }

      .box,
      .box2 {
        width: 100px;
        height: 100px;
      }

      .box {
        background-color: #c03a72;
        transform: matrix(1, 0.5, -0.5, 1, 50, 100);
      }

      .box2 {
        background-color: #cc9baf;
        transform: matrix(2, 3, -0.5, 1, 30, 100);
      }
    </style>
  </head>
  <body>
    <div class="box">box1</div>
    <div class="box2">box2</div>
  </body>
</html>
