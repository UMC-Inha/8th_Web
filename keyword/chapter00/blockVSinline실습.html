<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example</title>
    <style>
      .block {
        display: block;
        width: 200px;
        height: 50px;
        background-color: #cfb1ff;
        margin: 10px;
        text-align: center;
        line-height: 50px;
      }

      .inline {
        display: inline;
        background-color: #ffd2f3;
        padding: 10px;
        margin: 10px;
      }

      .inlineBlock {
        display: inline-block;
        width: 150px;
        height: 50px;
        background-color: #d1eceb;
        margin: 10px;
        text-align: center;
        line-height: 50px;
      }
    </style>
  </head>
  <body>
    <h2>Block</h2>
    <div class="block">Box 1</div>
    <div class="block">Box 2</div>
    <div class="block">Box 3</div>

    <h2>Inline</h2>
    <span class="inline">Box 1</span>
    <span class="inline">Box 2</span>
    <span class="inline">Box 3</span>

    <h2>Inline-Block</h2>
    <div class="inlineBlock">Box 1</div>
    <div class="inlineBlock">Box 2</div>
    <div class="inlineBlock">Box 3</div>
  </body>
</html>
